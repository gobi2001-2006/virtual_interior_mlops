version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: interior_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: virtual_interior_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interior_backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/virtual_interior_db
      - SQLITE_FALLBACK=false
      - UPLOAD_DIR=/app/uploads
      - MODEL_ARTIFACT_DIR=/app/ml/artifacts
      - ACTIVE_MODEL_VERSION=v003
      - FRONTEND_ORIGIN=http://localhost:5173,http://localhost:80
      - MLFLOW_TRACKING_URI=/app/ml/experiments/mlruns
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./ml/artifacts:/app/ml/artifacts
      - ./ml/data:/app/ml/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
    container_name: interior_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
