# Render Blueprint for Virtual Interior Designer
# FastAPI backend + React/Vite frontend + PostgreSQL

services:
  # 1. FastAPI Backend API
  - type: web
    name: virtual-interior-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: PYTHON_VERSION
        value: "3.12.2"

      - key: DATABASE_URL
        fromDatabase:
          name: virtual-interior-db
          property: connectionString

      - key: SQLITE_FALLBACK
        value: "false"

      - key: ACTIVE_MODEL_VERSION
        value: "v003"

      - key: FRONTEND_ORIGIN
        value: "*"

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_API_KEY
        generateValue: true

  # 2. React + Vite Frontend
  - type: web
    name: virtual-interior-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://virtual-interior-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: virtual-interior-db
    databaseName: virtual_interior_db
    user: postgres
    plan: free