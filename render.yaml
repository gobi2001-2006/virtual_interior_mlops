# Render Blueprint Specification for Virtual Interior Designer
# Deploy via: https://dashboard.render.com/blueprints
services:
  # 1. FastAPI Backend API
  - type: web
    name: virtual-interior-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-interior-db
          property: connectionString
      - key: SQLITE_FALLBACK
        value: "false"
      - key: ACTIVE_MODEL_VERSION
        value: "v003"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true

  # 2. React Vite Frontend SPA
  - type: static_site
    name: virtual-interior-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: virtual-interior-backend
          property: host
          value: "https://virtual-interior-backend.onrender.com/api"

databases:
  # 3. Managed PostgreSQL Database
  - name: virtual-interior-db
    databaseName: virtual_interior_db
    user: postgres
    plan: free
